services:
  - type: web
    name: todus-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TODUS_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "49"
